<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="map-title">
  <title id="map-title">Stylised map of Brigade Road, Indiranagar, Bengaluru showing the location of Spice Route</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1e7d6"/>
      <stop offset="1" stop-color="#e3d5bd"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#000" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#sky)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>

  <!-- green park -->
  <rect x="60" y="500" width="330" height="180" rx="18" fill="#9db88a" fill-opacity=".5"/>
  <text x="225" y="600" font-family="Georgia,serif" font-size="20" fill="#3c5a35" text-anchor="middle" opacity=".8">100ft Road Park</text>

  <!-- lake -->
  <path d="M930 60 q70 40 40 100 t-50 70 q-60 30 -70 -30 t80 -140z" fill="#a9c6d6" fill-opacity=".6"/>

  <!-- roads -->
  <g stroke="#fbf7f0" stroke-linecap="round" fill="none">
    <path d="M0 250h1200" stroke-width="40"/>
    <path d="M0 690h1200" stroke-width="28"/>
    <path d="M470 0v750" stroke-width="34"/>
    <path d="M880 0v750" stroke-width="24"/>
    <path d="M0 430h1200" stroke-width="16"/>
    <path d="M240 0v750" stroke-width="14"/>
    <path d="M1080 250v300" stroke-width="14"/>
  </g>
  <g stroke="#c9b89a" stroke-linecap="round" stroke-dasharray="14 18" fill="none" opacity=".8">
    <path d="M0 250h1200" stroke-width="2"/>
    <path d="M470 0v750" stroke-width="2"/>
  </g>

  <!-- main road labels -->
  <text x="500" y="240" font-family="Georgia,serif" font-size="21" fill="#5d4f42" opacity=".85">Brigade Road</text>
  <text x="492" y="600" font-family="Georgia,serif" font-size="18" fill="#5d4f42" opacity=".7" transform="rotate(-90 492 600)">CMH Road</text>
  <text x="890" y="420" font-family="Georgia,serif" font-size="18" fill="#5d4f42" opacity=".7" transform="rotate(-90 890 420)">12th Main</text>

  <!-- metro marker -->
  <g transform="translate(470 250)">
    <rect x="-46" y="-52" width="92" height="30" rx="8" fill="#0d0b09" opacity=".88"/>
    <text x="0" y="-31" font-family="Inter,Arial,sans-serif" font-size="15" fill="#e9c67e" text-anchor="middle">METRO</text>
  </g>

  <!-- the pin -->
  <g transform="translate(600 250)">
    <ellipse cx="0" cy="96" rx="34" ry="9" fill="#0d0b09" opacity=".2"/>
    <path d="M0-92 c40 0 66 30 66 64 0 44-66 96-66 96S-66 16-66-28c0-34 26-64 66-64z"
          fill="#a8321c" stroke="#fbf7f0" stroke-width="5"/>
    <circle cx="0" cy="-28" r="21" fill="#fbf7f0"/>
    <circle cx="0" cy="-28" r="13" fill="#c9962f"/>
  </g>

  <!-- callout -->
  <g transform="translate(700 150)">
    <rect x="0" y="0" width="330" height="104" rx="14" fill="#0d0b09" opacity=".93"/>
    <text x="24" y="40" font-family="Georgia,serif" font-size="26" fill="#fbf7f0">Spice Route</text>
    <text x="24" y="68" font-family="Inter,Arial,sans-serif" font-size="15" fill="#c3b6a4">42, Saffron Street · Brigade Road</text>
    <text x="24" y="90" font-family="Inter,Arial,sans-serif" font-size="15" fill="#c3b6a4">Bengaluru 560038</text>
  </g>

  <text x="60" y="726" font-family="Inter,Arial,sans-serif" font-size="15" fill="#7a6a5b" opacity=".85">Map placeholder — replace with a real Google Maps embed</text>
</svg>
